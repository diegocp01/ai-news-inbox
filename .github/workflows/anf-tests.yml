name: ANF isolated tests
on:
  pull_request:
    paths: ['workflows/anf/**', '.github/workflows/anf-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s workflows/anf/tests -v
